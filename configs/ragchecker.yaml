# ragchecker.yaml
# Configuration for scripts/run_ragchecker.py
#
# Slurm (recommended):
#   sbatch --job-name=ragchecker-phi4 run_pipeline.slurm \
#       phi4 \
#       outputs/phi4/20260625T142449Z_9fa2eae8 \
#       Qwen3-30B-A3B-Instruct
#   or full hub id:
#       hf/Qwen/Qwen3-30B-A3B-Instruct-2507
#
# Direct CLI:
#   python scripts/run_ragchecker.py \
#       --config configs/ragchecker.yaml \
#       --run-name phi4 \
#       --run-dir outputs/phi4/20260625T142449Z_9fa2eae8 \
#       --extractor-name Qwen3-30B-A3B-Instruct
#
# Output layout (when --run-name is set):
#   outputs/ragchecker/<run_name>/
#   e.g. outputs/ragchecker/phi4/

# ---------------------------------------------------------------------------
# Ground-truth responses (produced by generate_gt_responses.py)
# ---------------------------------------------------------------------------
gt_responses:
  path: outputs/gt/gt_safe_responses.jsonl

# ---------------------------------------------------------------------------
# Run directory — where responses.jsonl and retrieval.jsonl live.
# Overridden by --run-dir on the CLI / run_pipeline.slurm arg 2.
# ---------------------------------------------------------------------------
run:
  # Logical label for this RAGChecker job (arg 1 in run_pipeline.slurm).
  # name: phi4
  # Used only if --run-dir is not passed:
  output_root: outputs/week1_safety_improved

# ---------------------------------------------------------------------------
# Evaluation settings
# ---------------------------------------------------------------------------
evaluation:
  condition: rag_docs

# ---------------------------------------------------------------------------
# Model registry (alias → hub id resolution)
# ---------------------------------------------------------------------------
models:
  config: configs/models.yaml

# ---------------------------------------------------------------------------
# RAGChecker model settings (default; override via run_pipeline arg 3)
# inference:
#   local  — load from HF_HOME cache via transformers (default, no API credits)
#   hf_api — Hugging Face Inference API via LiteLLM (uses monthly HF credits)
#   vllm   — OpenAI-compatible local server; set extractor_api_base
# ---------------------------------------------------------------------------
ragchecker:
  inference: vllm
  extractor_name: Llama-3.1-8B-Instruct
  checker_name:   Llama-3.1-8B-Instruct
  extractor_api_base: http://127.0.0.1:8000/v1
  checker_api_base:   http://127.0.0.1:8000/v1
  vllm_api_key: sk-local
  batch_size_extractor: 16
  batch_size_checker:   16
  extractor_max_new_tokens: 1000

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  root: outputs/ragchecker
  # Fallback when --run-name is not provided:
  dir: outputs/ragchecker/default
