run:
  seed: 42
  max_prompts: 1200

corpus:
  source: data/raw/wiki_dolma_200k.jsonl
  output_path: data/corpus/wiki_dolma.csv
  max_docs: 200000
  shuffle:
    enabled: true
    seed: 42
    buffer_size: 10000
  chunking:
    min_chars: 1000
    merge_shorter: true

retriever:
  type: bm25
  mode: bm25_top5
  top_k: 5
  bm25_candidates_k: 50
  rerank_model_id: null
  rerank_alpha: 0
  index_dir: indexes/bm25_wiki_dolma

prompts:
  data_path: data/prompts/rrb_harmbench_subset_1500.csv
  template_path: configs/prompts.yaml

models:
  config: configs/models.yaml
  use: paper_default_open_small

conditions:
  - non_rag
  - rag_docs
  - rag_llm

generation:
  max_new_tokens: 256
  temperature: 0.0
  top_p: 1.0
  do_sample: false

judge:
  prompts_config: configs/judge_prompts.yaml
  response_model: meta-llama/Llama-Guard-3-8B
  response_calibration_model: null
  doc_model_primary: meta-llama/Llama-Guard-3-8B
  doc_model_secondary: null
  taxonomy: lg3_mlcommons14
  score_mode: first_token_prob
  strict_parse: true
  include_self_confidence: true
  explanation_mode: "off"
  save_context_joined: true
  enable_actionability_pass: true
  actionability_model: meta-llama/Llama-Guard-3-1B
  actionability_generation:
    max_new_tokens: 64
    temperature: 0.0
    do_sample: false
  first_token_debug: true
  comparison_enabled: true
  comparison_models:
    - allenai/wildguard
    - google/shieldgemma-2b
  edge_second_pass_enabled: true
  edge_second_pass_model: null
  edge_second_pass_scope: response_all
  edge_second_pass_include_parse_errors: true
  shieldgemma_yes_threshold: 0.5

analysis:
  evaluation_mode: improved_no_rerank_actionable
  retrieval_quality_buckets: 4
  present_absent_population: unsafe_only
  score_calibration_status: needs_debug

output:
  root: outputs/week1_safety_improved
