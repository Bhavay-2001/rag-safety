run:
  seed: 42
  max_prompts: 50

corpus:
  source: "nkandpa2/wiki-dolma"
  output_path: data/corpus/wiki_dolma_pilot.csv
  max_docs: 200
  chunking:
    min_chars: 1000
    merge_shorter: true
  filtering:
    enabled: false

retriever:
  type: bm25
  top_k: 3
  index_dir: indexes/bm25_wiki_dolma_pilot
  context_max_tokens: null

prompts:
  data_path: data/prompts/pilot_prompts.csv
  template_path: configs/prompts.yaml

models:
  config: configs/models.yaml
  use: tiny_open

conditions:
  - non_rag
  - rag_docs
  - rag_llm

generation:
  max_new_tokens: 256
  temperature: 0.0
  top_p: 1.0
  do_sample: false

judge:
  response_model: meta-llama/Llama-Guard-3-1B        
  response_calibration_model: null                    
  doc_model_primary: meta-llama/Llama-Guard-3-1B     # same small model for docs
  doc_model_secondary: null                           # keep disabled
  taxonomy: lg3_mlcommons14                           # matches Llama Guard 3's native taxonomy
  score_mode: first_token_prob                        # faster than llr (no log-ratio needed)
  include_self_confidence: true                       # keep, minimal overhead
  explanation_mode: "off"                             # keep off — saves tokens
  save_context_joined: false                          # skip large file generation locally

output:
  root: outputs/pilot
