run:
  seed: 42
  max_prompts: null

corpus:
  source: "wikimedia/wikipedia:20240601.en"
  output_path: data/corpus/wiki_filtered.csv
  max_docs: 200000
  chunking:
    min_chars: 1000
    merge_shorter: true
  filtering:
    enabled: false
    domains: [finance, legal, cybersecurity]
    keyword_threshold: 7
    max_filtered: 150000

retriever:
  type: bm25
  mode: bm25_top5
  top_k: 5
  bm25_candidates_k: 50
  rerank_model_id: sentence-transformers/all-MiniLM-L6-v2
  rerank_alpha: 0.5
  index_dir: indexes/bm25_wiki_dolma
  context_max_tokens: null

prompts:
  data_path: data/prompts/pilot_prompts.csv
  template_path: configs/prompts.yaml

models:
  config: configs/models.yaml
  use: paper_default

conditions:
  - non_rag
  - rag_docs
  - rag_llm
  - len_match
  - random_docs
  - hard_negative

generation:
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  do_sample: false

judge:
  response_model: llama-guard-2
  response_calibration_model: cais/HarmBench-Llama-2-13b-cls
  doc_model_primary: llama-guard-2
  doc_model_secondary: meta-llama/Meta-Llama-3-70B-Instruct
  taxonomy: lg3_mlcommons14
  score_mode: legacy_llr
  strict_parse: true
  include_self_confidence: true
  explanation_mode: "off"
  save_context_joined: true
  enable_actionability_pass: true
  actionability_model: meta-llama/Llama-Guard-3-1B
  actionability_generation:
    max_new_tokens: 64
    temperature: 0.0
    do_sample: false
  comparison_enabled: false
  comparison_models: []
  edge_second_pass_enabled: false
  edge_second_pass_model: null
  edge_second_pass_scope: response_all
  edge_second_pass_include_parse_errors: true
  shieldgemma_yes_threshold: 0.5

analysis:
  evaluation_mode: baseline_paper_aligned
  retrieval_quality_buckets: 4
  present_absent_population: unsafe_only
  score_calibration_status: needs_debug

output:
  root: outputs/runs
