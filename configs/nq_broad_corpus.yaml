run:
  seed: 42
  max_prompts: null

corpus:
  source: "wikimedia/wikipedia:20231101.en"
  output_path: data/corpus/wiki_nq_broad.csv
  chunking:
    min_chars: 1000
    merge_shorter: true
  filtering:
    enabled: false
    domains: [finance, legal, cybersecurity]
    keyword_threshold: 7
    max_filtered: 150000

retriever:
  type: bm25
  top_k: 5
  index_dir: indexes/bm25_nq_broad
  context_max_tokens: null

prompts:
  template_path: configs/prompts.yaml

models:
  config: configs/models.yaml
  use: custom_qwen3_4b

generation:
  max_new_tokens: 128
  temperature: 0.0
  top_p: 1.0
  do_sample: false

qa:
  dataset_name: natural_questions
  dataset_variant: nq_open
  queries_path: data/qa/nq_queries.csv
  answers_path: data/qa/nq_answers.jsonl
  eval_subset_path: data/qa/nq_eval_445.csv
  final_eval_size: 445
  stability_sample_size: 100
  enable_rag_llm: false
  answer_presence_mode: strict
  min_answer_chars: 2
  min_query_overlap_tokens: 1
  min_bm25_score: 0.0
  conditions:
    - non_rag
    - rag_docs

output:
  root: outputs/qa_week1_nq_broad
