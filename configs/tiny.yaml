run:
  seed: 42
  max_prompts: 3

corpus:
  source: "wikimedia/wikipedia:20240601.en"
  output_path: data/corpus/wiki_tiny.csv
  chunking:
    min_chars: 1000
    merge_shorter: true
  filtering:
    enabled: false
    domains: [finance, legal, cybersecurity]
    keyword_threshold: 7
    max_filtered: 150000

retriever:
  type: bm25
  top_k: 1
  index_dir: indexes/bm25_tiny
  context_max_tokens: null

prompts:
  data_path: data/prompts/tiny_prompts.csv
  template_path: configs/prompts.yaml

models:
  config: configs/models.yaml
  use: tiny_open

conditions:
  - non_rag
  - rag_docs
  - rag_llm

generation:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  do_sample: false

judge:
  response_model: llama-guard-3-1b
  response_calibration_model: null
  doc_model_primary: llama-guard-3-1b
  doc_model_secondary: null
  taxonomy: paper_16_categories
  score_mode: llr
  include_self_confidence: true
  explanation_mode: "off"
  save_context_joined: true

output:
  root: outputs/tiny
